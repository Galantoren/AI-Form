:root{
  --void-0:#08071c;
  --void-1:#100e2c;
  --void-2:#1a1740;
  --void-3:#252057;
  --line:rgba(206,204,229,0.14);
  --line-strong:rgba(206,204,229,0.26);
  --violet:#302c69;
  --iris:#7a73a8;
  --periwinkle:#cecce5;
  --lime:#dff670;
  --lime-dim:#c2d456;
  --white:#ffffff;
  --ink:#eeecf9;
  --muted:#9691c4;
  --faint:#655f92;
  --gold:#f2b84b;
  --coral:#ef6a6a;
  --mist:#9e97cb;
  --radius:4px;
  --font-display:'Relay Sans',Poppins,Arial,Helvetica,sans-serif;
  --font-mono:'Relay Mono','JetBrains Mono',ui-monospace,monospace;
  --shadow-lg:0 24px 64px rgba(4,3,16,0.55);
  --focus-ring:0 0 0 3px rgba(223,246,112,0.35);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void-0);
  color:var(--ink);
  font-family:var(--font-display);
  font-weight:400;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:500;
  color:var(--white);
  margin:0;
  text-wrap:balance;
  letter-spacing:-0.01em;
}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--lime);color:var(--violet);}

#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
#burst{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;opacity:0;}

#app{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.eyebrow{
  font-family:var(--font-mono);
  font-weight:500;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,4vw,48px);
  gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:30px;height:30px;flex:none;
  border:1px solid var(--lime);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  background:rgba(223,246,112,0.08);
}
.brand-mark svg{filter:drop-shadow(0 0 6px rgba(223,246,112,0.5));}
.sparkle{flex:none;}
.brand-sub{font-family:var(--font-mono);font-size:12.5px;letter-spacing:0.04em;color:var(--periwinkle);}

.hud-link{
  font-family:var(--font-mono);font-size:12px;letter-spacing:0.06em;
  color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,0.02);
  cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.hud-link:hover{border-color:var(--line-strong);color:var(--periwinkle);background:rgba(255,255,255,0.04);}
.hud-dot{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);}

main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px 64px;}

/* ---- Landing ---- */
.landing{max-width:720px;margin-top:clamp(40px,10vh,110px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;}
.landing h1{font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-0.02em;}
.landing h1 em{font-style:normal;color:var(--lime);}
.landing p.lede{color:var(--periwinkle);font-size:17px;line-height:1.65;max-width:560px;}
.stat-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.stat-chip{display:flex;flex-direction:column;gap:2px;align-items:center;}
.stat-chip b{font-family:var(--font-mono);font-size:22px;color:var(--lime);}
.stat-chip span{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--faint);text-transform:uppercase;}

.btn{
  font-family:var(--font-display);font-weight:600;font-size:16px;
  padding:15px 34px;border-radius:var(--radius);border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;justify-content:center;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;
}
.btn-primary{background:var(--lime);color:var(--violet);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
.btn-primary:hover{background:var(--lime-dim);box-shadow:0 0 0 6px rgba(223,246,112,0.12);}
.btn-primary:active{transform:scale(0.98);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--periwinkle);border:1px solid var(--line-strong);}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime);}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}

/* ---- Console panel ---- */
.console-wrap{width:100%;max-width:600px;margin-top:clamp(24px,6vh,56px);display:flex;flex-direction:column;gap:22px;}
.rail{display:flex;align-items:center;gap:0;}
.rail-node{
  width:26px;height:26px;flex:none;border:1px solid var(--line-strong);
  clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
  display:flex;align-items:center;justify-content:center;

<script id="app-script">
/* GitHub Issues is the shared backend. Reads hit the public GitHub API
   directly (no auth needed for a public repo); writes go through a small

const GITHUB_REPO = 'Galantoren/AI-Form';
const SIGNAL_LABEL = 'signal';
const SUBMIT_ENDPOINT = 'https://signal-relay-submit.allan-partush.workers.dev/submit';
const SUBMISSIONS_CACHE_KEY = 'signalRelaySubmissionsCache';
const SUBMISSIONS_CACHE_TTL = 45000;

const PRIORITIES = ['Low','Medium','High','Mission-Critical'];
const SITES = ['UK','US','TLV'];
const TEAMS = ['Enterprise','SMB'];
const PRI_CALLSIGN = {'Low':'SCOUT','Medium':'VOYAGER','High':'PATHFINDER','Mission-Critical':'VANGUARD'};

let state = { submissions: [], loaded: false, loading: false };

let route = location.hash === '#control' ? 'dashboard' : 'form';
let toastTimer = null;

let form = {
  step: 0,
  name:'', site:null, team:null, headline:'', details:'', priority:'Medium', wantsDemo:false,
  wantsSkillShare:false, skill:''
};
let lastConfirmation = null;

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function genId(){ return 'sig-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
function relTime(ts){
  const diff = Date.now() - ts;
  const m = Math.round(diff/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.round(m/60);
  if(h < 24) return h + 'h ago';
  const d = Math.round(h/24);
  return d + 'd ago';
}

/* ---------------- starfield ---------------- */
(function starfield(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,stars=[],nebulae=[];
  function size(){
    w = canvas.width = window.innerWidth * Math.min(devicePixelRatio||1,2);
    h = canvas.height = window.innerHeight * Math.min(devicePixelRatio||1,2);
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
  }
  function init(){
    size();
    const count = Math.round((w*h)/26000);
    stars = Array.from({length:count},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.6+0.4,
      a:Math.random()*0.6+0.25, phase:Math.random()*Math.PI*2, speed:Math.random()*0.02+0.008
    }));
    nebulae = [
      {x:w*0.18,y:h*0.22,r:Math.max(w,h)*0.32,c:'48,44,105'},
      {x:w*0.85,y:h*0.75,r:Math.max(w,h)*0.28,c:'122,115,168'},
      {x:w*0.65,y:h*0.15,r:Math.max(w,h)*0.22,c:'158,151,203'}
    ];
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#08071c';
    ctx.fillRect(0,0,w,h);
    nebulae.forEach(n=>{
      const g = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0,'rgba('+n.c+',0.22)');
      g.addColorStop(1,'rgba('+n.c+',0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    });
    stars.forEach(s=>{
      const tw = reduced ? s.a : s.a + Math.sin(t*s.speed + s.phase)*0.25;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(238,236,249,'+clamp(tw,0,1)+')';
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    });
    if(!reduced) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', init);
  init();
  draw(0);
})();

/* ---------------- burst animation ---------------- */
function playBurst(){
  return new Promise(resolve=>{
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){ resolve(); return; }
    const canvas = document.getElementById('burst');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(devicePixelRatio||1,2);
    const w = canvas.width = window.innerWidth*dpr;
    const h = canvas.height = window.innerHeight*dpr;
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    canvas.style.opacity = '1';
    const cx = w/2, cy = h/2.4;
    const colors = ['#dff670','#f2b84b','#ef6a6a','#9e97cb','#eeecf9'];
    const particles = Array.from({length:140},()=>{
      const ang = Math.random()*Math.PI*2;
      const speed = (Math.random()*7+3)*dpr;
      return {
        x:cx,y:cy,
        vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        r:(Math.random()*2.4+1.2)*dpr,
        c:colors[Math.floor(Math.random()*colors.length)],
        life:1
      };
    });
    let rings = [{r:0,a:1},{r:0,a:1}];
    const start = performance.now();
    const duration = 1300;
    function frame(now){
      const t = now - start;
      ctx.clearRect(0,0,w,h);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const flashA = Math.max(0, 1 - t/220);
      if(flashA>0){
        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,220*dpr);
        g.addColorStop(0,'rgba(238,236,249,'+(flashA*0.9)+')');
        g.addColorStop(1,'rgba(238,236,249,0)');
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      }
      rings.forEach((ring,i)=>{
        ring.r = (t*0.7*dpr) + i*40*dpr;
        ring.a = Math.max(0, 1 - t/900);
        if(ring.a>0){
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(223,246,112,'+(ring.a*0.5)+')';
          ctx.lineWidth = 2*dpr;
          ctx.arc(cx,cy,ring.r,0,Math.PI*2);
          ctx.stroke();
        }
      });
      particles.forEach(p=>{
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.975; p.vy = p.vy*0.975 + 0.05*dpr;
        p.life = Math.max(0, 1 - t/duration);
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = p.life;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      });
      ctx.restore();
      if(t < duration){
        requestAnimationFrame(frame);
      }else{
        canvas.style.opacity = '0';
        ctx.clearRect(0,0,w,h);
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ---------------- persistence (GitHub Issues) ---------------- */
function localBackupKey(){ return 'signalRelayLocalBackup'; }
function pushLocalBackup(sub){
  try{
    const raw = localStorage.getItem(localBackupKey());
    const arr = raw ? JSON.parse(raw) : [];
    arr.push(sub);
    localStorage.setItem(localBackupKey(), JSON.stringify(arr));
  }catch(e){}
}
function readLocalBackup(){
  try{
    const raw = localStorage.getItem(localBackupKey());
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function dropLocalBackup(id){
  try{
    const arr = readLocalBackup().filter(s=>s.id!==id);
    localStorage.setItem(localBackupKey(), JSON.stringify(arr));
  }catch(e){}
}
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.querySelector('.toast');
  if(!t){ t = el('<div class="toast"></div>'); document.body.appendChild(t); }
  t.textContent = msg;
  toastTimer = setTimeout(()=>{ t.remove(); }, 4200);
}

/* Submissions live as GitHub Issues labeled "signal" — each issue body ends
   in a fenced ```json block holding the structured fields. Reads hit the
   public GitHub REST API directly; writes go through SUBMIT_ENDPOINT so the
   write token never touches this public page. */
function parseSubmissionFromIssue(issue){
  const body = issue.body || '';
  const match = body.match(/```json\n([\s\S]*?)\n```/);
  if(!match) return null;
  try{
    const data = JSON.parse(match[1]);
    if(!data.id) data.id = 'issue-' + issue.number;
    data.issueNumber = issue.number;
    return data;
  }catch(e){ return null; }
}

async function fetchAllSignalIssues(){
  const out = [];
  let page = 1;
  while(true){
    const url = 'https://api.github.com/repos/'+GITHUB_REPO+'/issues?labels='+encodeURIComponent(SIGNAL_LABEL)+'&state=all&per_page=100&page='+page;
    const resp = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
    if(!resp.ok) throw new Error('github_fetch_failed:'+resp.status);
    const batch = await resp.json();
    out.push.apply(out, batch);
    if(batch.length < 100) break;
    page++;
    if(page > 20) break; // sanity cap
  }
  return out;
}

async function loadSubmissions(force){
  if(!force){
    try{
      const raw = sessionStorage.getItem(SUBMISSIONS_CACHE_KEY);
      if(raw){
        const cached = JSON.parse(raw);
        if(Date.now() - cached.ts < SUBMISSIONS_CACHE_TTL){
          state.submissions = cached.submissions;
          state.loaded = true;
          return;
        }
      }
    }catch(e){}
  }
  state.loading = true;
  render();
  try{
    const issues = await fetchAllSignalIssues();
    const subs = issues.map(parseSubmissionFromIssue).filter(Boolean);
    subs.forEach(s=>dropLocalBackup(s.id));
    state.submissions = subs;
    state.loaded = true;
    try{ sessionStorage.setItem(SUBMISSIONS_CACHE_KEY, JSON.stringify({ts:Date.now(), submissions:subs})); }catch(e){}
  }catch(e){
    showToast('Could not reach the shared board — showing signals saved on this device only.');
  }finally{
    state.loading = false;
    render();
  }
}

async function submitSignal(submission){
  try{
    const resp = await fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(submission)
    });
    if(!resp.ok) throw new Error('submit_failed:'+resp.status);
    const result = await resp.json();
    try{ sessionStorage.removeItem(SUBMISSIONS_CACHE_KEY); }catch(e){}
    return { ok:true, crewId: result.crewId, crewSeq: result.crewSeq };
  }catch(e){
    pushLocalBackup(submission);
    showToast('Could not reach the shared board — your signal is saved on this device. Try resubmitting later.');
    return { ok:false };
  }
}

/* ---------------- render: shared ---------------- */
const SPARKLE_SVG = '<svg class="sparkle" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 1.5C12 1.5 12.9 9.4 16.5 12C12.9 14.6 12 22.5 12 22.5C12 22.5 11.1 14.6 7.5 12C11.1 9.4 12 1.5 12 1.5Z" fill="#dff670"/></svg>';

function topbar(){
  return '<div class="topbar"><div class="brand">' +
    '<div class="brand-mark">'+SPARKLE_SVG+'</div>' +
    '<div><div class="brand-sub">Optimove CS &middot; AI Workshop Feedback</div></div>' +
    '</div>' +
    (route==='dashboard'
      ? '<a class="hud-link" data-action="go-form" href="#"><span class="hud-dot"></span>New Signal</a>'
      : '<a class="hud-link" data-action="go-dash" href="#control"><span class="hud-dot"></span>Mission Control</a>') +
    '</div>';
}

function render(){
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  app.innerHTML = topbar() + '<main>' + (route==='dashboard' ? renderDashboard() : renderFormRoute()) + '</main>' +
    '<footer>TRANSMISSIONS ARE REVIEWED BY MISSION CONTROL AHEAD OF THE AI WORKSHOP</footer>';
  window.scrollTo(0, scrollY);
}

function renderFormRoute(){
  if(lastConfirmation) return renderConfirmation();
  if(form.step === 0) return renderLanding();
  return renderStep();
}

function renderLanding(){
  return '<div class="landing">' +
    '<p class="eyebrow">Optimove CS &middot; Before The AI Workshop</p>' +
    '<h1>What should the <em>AI Workshop</em><br>actually fix?</h1>' +
    '<p class="lede">Your ideas, blockers, and asks shape the agenda &mdash; not ours. One screen, one signal, sent straight to Mission Control.</p>' +
    '<button class="btn btn-primary" data-action="start">Send Your Signal →</button>' +
    '<div class="stat-row">' +
      '<div class="stat-chip"><b class="mono">' + (state.loaded ? state.submissions.length : '—') + '</b><span>Signals received</span></div>' +
      '<div class="stat-chip"><b class="mono">1</b><span>Screen</span></div>' +
      '<div class="stat-chip"><b class="mono">~1min</b><span>Time to launch</span></div>' +
    '</div>' +
  '</div>';
}

function fieldsFilled(){
  let n = 0;
  if(form.name.trim()) n++;
  if(form.site) n++;
  if(form.team) n++;
  if(form.headline.trim() && form.details.trim().length >= 6) n++;
  if(form.priority) n++;
  return n;
}

function radioGroup(action, options, selected){
  return '<div class="tag-grid">' + options.map(o=>
    '<button type="button" class="tag-pill'+(selected===o?' on':'')+'" data-action="'+action+'" data-value="'+escapeHtml(o)+'">'+escapeHtml(o)+'</button>'
  ).join('') + '</div>';
}

let panelEntered = false;

function renderStep(){
  const pct = Math.round((fieldsFilled()/5)*100);
  const bars = PRIORITIES.map((p,i)=>{
    const on = form.priority===p;
    let barHtml='';
    for(let b=0;b<4;b++) barHtml += '<i class="'+(b<=i?'fill':'')+'" style="height:'+(6+b*5)+'px"></i>';
    return '<div class="pri-card'+(on?' on':'')+'" data-action="pick-pri" data-pri="'+p+'">' +
      '<div class="pri-bars">'+barHtml+'</div><div class="pri-label">'+p+'</div></div>';
  }).join('');

  const body = '<p class="eyebrow step-eyebrow">Send A Signal</p>' +
    '<h3 class="step-title">Tell Mission Control what&rsquo;s going on.</h3>' +
    '<div class="field"><label>Name</label>' +
    '<input type="text" id="f-name" placeholder="The human behind this idea" value="'+escapeHtml(form.name)+'" data-field="name">' +
    '<div class="field-error" id="err-name"></div></div>' +
    '<div class="field"><label>Site</label>' +
    radioGroup('pick-site', SITES, form.site) +
    '<div class="field-error" id="err-site"></div></div>' +
    '<div class="field"><label>Team</label>' +
    radioGroup('pick-team', TEAMS, form.team) +
    '<div class="field-error" id="err-team"></div></div>' +
    '<div class="field"><label>Headline</label>' +
    '<input type="text" id="f-headline" placeholder="One line. Make it count." value="'+escapeHtml(form.headline)+'" data-field="headline" maxlength="90">' +
    '<div class="field-error" id="err-headline"></div></div>' +
    '<div class="field"><label>Details</label>' +
    '<textarea id="f-details" placeholder="Give us the full picture — category gets sorted out on our end." data-field="details" maxlength="1600" style="min-height:120px">'+escapeHtml(form.details)+'</textarea>' +
    '<div class="field-error" id="err-details"></div></div>' +
    '<div class="field"><label>Priority</label>' +
    '<div class="pri-grid">'+bars+'</div></div>' +
    '<div class="switch-row"><span>I am brave enough to demo this live at the workshop</span>' +
    '<div class="switch'+(form.wantsDemo?' on':'')+'" data-action="toggle-demo"><i></i></div></div>' +
    '<div class="field"><label>Skill Sharing <span style="text-transform:none;color:var(--faint)">(optional)</span></label>' +
    '<div class="switch-row"><span>I have a skill I could teach the team</span>' +
    '<div class="switch'+(form.wantsSkillShare?' on':'')+'" data-action="toggle-skill"><i></i></div></div>' +
    (form.wantsSkillShare ?
      '<input type="text" id="f-skill" placeholder="What skill? e.g. prompt engineering, Excel macros, objection handling" value="'+escapeHtml(form.skill)+'" data-field="skill" style="margin-top:10px" maxlength="80">'
      : '') +
    '</div>' +
    '<div class="nav-row"><span></span><button class="btn btn-primary" data-action="launch">Launch Signal →</button></div>';

  const enterClass = panelEntered ? '' : ' panel-in';
  panelEntered = true;
  return '<div class="console-wrap">' +
    '<div class="hud-readout"><span>Signal Strength</span><span><b>'+pct+'%</b></span></div>' +
    '<div class="panel'+enterClass+'" id="step-panel">' + body + '</div>' +
  '</div>';
}

function renderConfirmation(){
  const s = lastConfirmation;
  const callsign = PRI_CALLSIGN[s.priority] || 'VOYAGER';
  return '<div class="confirm">' +
    '<div class="confirm-badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="#dff670" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<div><h2>Signal received, '+escapeHtml(s.name)+'.</h2>' +
    '<p class="callsign">CALLSIGN: '+callsign+'</p></div>' +
    '<div class="confirm-meta">' +
      '<div><b class="mono">'+s.crewId+'</b><span>Crew ID</span></div>' +
      '<div><b class="mono">'+escapeHtml(s.site)+'</b><span>Site</span></div>' +
      '<div><b class="mono">'+s.priority+'</b><span>Priority</span></div>' +
    '</div>' +
    (s._synced===false
      ? '<p class="notice">Could not reach Mission Control — this signal is saved on this device only. Try &ldquo;Send Another Signal&rdquo; again once you&rsquo;re back online.</p>'
      : ('<p class="tally">You are signal <b class="mono" style="color:var(--lime)">#'+s.crewSeq+'</b> received from the crew ahead of the workshop.</p>' +
         '<p class="notice">Mission Control will read this. Eventually. Probably before the workshop.</p>')
    ) +
    '<div class="confirm-actions">' +
      '<button class="btn btn-primary" data-action="reset">Send Another Signal</button>' +
      '<a class="btn btn-ghost" data-action="go-dash" href="#control">View Mission Control</a>' +
    '</div>' +
  '</div>';
}

/* ---------------- dashboard ---------------- */
function allSubmissionsForDisplay(){
  const local = readLocalBackup().map(s=>Object.assign({},s,{_local:true}));
  const known = state.submissions.map(s=>s.id);
  return state.submissions.concat(local.filter(s=>known.indexOf(s.id)===-1));
}

function priorityIcon(priority){
  const i = Math.max(0, PRIORITIES.indexOf(priority));
  let bars = '';
  for(let b=0;b<4;b++) bars += '<i class="'+(b<=i?'fill':'')+'" style="height:'+(4+b*3)+'px"></i>';
  return '<span class="pri-icon" title="'+escapeHtml(priority)+'"><span class="pri-icon-bars">'+bars+'</span></span>';
}

function renderDashboard(){
  if(state.loading && !state.loaded){
    return '<div class="dash"><div class="dash-head"><div><p class="eyebrow">Live Signal Board</p><h2>AI Workshop — Mission Control</h2></div></div>' +
      '<div class="empty-state"><p class="eyebrow">Loading signals&hellip;</p></div></div>';
  }
  const subs = allSubmissionsForDisplay();
  const byPri = {Low:0,Medium:0,High:0,'Mission-Critical':0};
  const bySite = {UK:0,US:0,TLV:0};
  const byTeam = {Enterprise:0,SMB:0};
  let demo = 0, urgent = 0, skillShare = 0;
  subs.forEach(s=>{
    byPri[s.priority]=(byPri[s.priority]||0)+1;
    if(s.site) bySite[s.site]=(bySite[s.site]||0)+1;
    if(s.team) byTeam[s.team]=(byTeam[s.team]||0)+1;
    if(s.wantsDemo) demo++;
    if(s.wantsSkillShare) skillShare++;
    if(s.priority==='High'||s.priority==='Mission-Critical') urgent++;
  });

  const tiles = [
    ['Total Signals', subs.length, 'var(--lime)'],
    ['Urgent (High+)', urgent, URGENT_HEX],
    ['Demo Volunteers', demo, 'var(--periwinkle)'],
    ['Skills Offered', skillShare, 'var(--mist)']
  ].map(t=>'<div class="tile" style="--tile-c:'+t[2]+'"><b class="mono">'+t[1]+'</b><span>'+t[0]+'</span></div>').join('');

  const maxPri = Math.max(1,...PRIORITIES.map(p=>byPri[p]));
  const priCols = PRIORITIES.map(p=>{
    const h = Math.round((byPri[p]/maxPri)*100);
    return '<div class="pri-dist-col"><b class="mono">'+byPri[p]+'</b><div class="pri-dist-bar" style="height:'+Math.max(h,3)+'%"></div><span>'+p+'</span></div>';
  }).join('');

  const maxSite = Math.max(1,...SITES.map(r=>bySite[r]));
  const siteCols = SITES.map(r=>{
    const h = Math.round((bySite[r]/maxSite)*100);
    return '<div class="pri-dist-col"><b class="mono">'+bySite[r]+'</b><div class="pri-dist-bar" style="height:'+Math.max(h,3)+'%"></div><span>'+r+'</span></div>';
  }).join('');
  const maxTeam = Math.max(1,...TEAMS.map(t=>byTeam[t]));
  const teamCols = TEAMS.map(t=>{
    const h = Math.round((byTeam[t]/maxTeam)*100);
    return '<div class="pri-dist-col"><b class="mono">'+byTeam[t]+'</b><div class="pri-dist-bar" style="height:'+Math.max(h,3)+'%"></div><span>'+t+'</span></div>';
  }).join('');

  const sorted = subs.slice().sort((a,b)=>b.ts-a.ts);
  const tableBody = sorted.length ? sorted.map(rowHtml).join('') : '';
  // Skill text people wrote in is intentionally not rendered on the shared
  // dashboard — it's only available via CSV export, kept out of view here.

  return '<div class="dash">' +
    '<div class="dash-head"><div><p class="eyebrow">Live Signal Board</p><h2>AI Workshop — Mission Control</h2></div>' +
    '<div class="dash-actions"><button class="btn btn-ghost btn-sm" data-action="refresh">'+(state.loading?'Refreshing…':'Refresh')+'</button><button class="btn btn-ghost btn-sm" data-action="export">Export CSV</button></div></div>' +
    '<div class="tiles">'+tiles+'</div>' +
    '<div class="dash-grid-2">' +
      '<div class="panel-flat"><h3>Priority Distribution</h3><div class="pri-dist">'+priCols+'</div></div>' +
      '<div class="panel-flat"><h3>Signals by Site</h3><div class="pri-dist">'+siteCols+'</div></div>' +
    '</div>' +
    '<div class="panel-flat"><h3>Signals by Team</h3><div class="pri-dist">'+teamCols+'</div></div>' +
    '<div class="panel-flat">' +
      '<h3>Transmission Log</h3>' +
      '<p class="field-hint" style="margin-bottom:14px">Crew identity is kept off this board &mdash; each row shows site, team, and headline only.</p>' +
      (sorted.length ?
        '<div class="table-wrap"><table><thead><tr><th>Site</th><th>Team</th><th>Headline</th><th>Priority</th></tr></thead><tbody>'+tableBody+'</tbody></table></div>'
        : '<div class="empty-state"><p class="eyebrow">No signals yet</p><p>Be the first to transmit.</p><button class="btn btn-primary btn-sm" data-action="go-form" style="margin-top:6px">New Signal</button></div>'
      ) +
    '</div>' +
  '</div>';
}
const URGENT_HEX = '#ef6a6a';
function rowHtml(s){
  return '<tr><td class="mono">'+escapeHtml(s.site||'—')+(s._local?'<span class="local-tag">DEVICE</span>':'')+'</td>' +
    '<td class="mono">'+escapeHtml(s.team||'—')+'</td>' +
    '<td>'+escapeHtml(s.headline)+'</td>' +
    '<td>'+priorityIcon(s.priority)+'</td></tr>';
}

function exportCsv(){
  const subs = allSubmissionsForDisplay();
  const headers = ['Crew ID','Name','Site','Team','Headline','Details','Priority','Wants Demo','Skill Offered','Received'];
  const lines = [headers.join(',')];
  subs.forEach(s=>{
    const row = [s.crewId,s.name,s.site||'',s.team||'',s.headline,s.details,s.priority,s.wantsDemo?'Yes':'No',s.wantsSkillShare?(s.skill||'Yes'):'No',new Date(s.ts).toISOString()];
    lines.push(row.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ai-workshop-signals.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------------- validation + step flow ---------------- */
function setError(id,msg){ const e=document.getElementById(id); if(e) e.textContent = msg||''; }
function shakePanel(){ const p=document.getElementById('step-panel'); if(p){ p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); } }

function validateForm(){
  setError('err-name',''); setError('err-site',''); setError('err-team',''); setError('err-headline',''); setError('err-details','');
  if(!form.name.trim()){ setError('err-name','Enter your name to continue.'); shakePanel(); return false; }
  if(!form.site){ setError('err-site','Pick a site.'); shakePanel(); return false; }
  if(!form.team){ setError('err-team','Pick a team.'); shakePanel(); return false; }
  if(!form.headline.trim()){ setError('err-headline','Give your signal a headline.'); shakePanel(); return false; }
  if(form.details.trim().length < 6){ setError('err-details','Give us a little more to go on.'); shakePanel(); return false; }
  return true;
}

async function launchSignal(){
  if(!validateForm()) return;
  const submission = {
    id: genId(), ts: Date.now(),
    name: form.name.trim(), site: form.site, team: form.team,
    headline: form.headline.trim(), details: form.details.trim(),
    priority: form.priority, wantsDemo: form.wantsDemo,
    wantsSkillShare: form.wantsSkillShare, skill: form.wantsSkillShare ? form.skill.trim() : ''
  };
  const launchBtn = document.querySelector('[data-action="launch"]');
  if(launchBtn){ launchBtn.disabled = true; launchBtn.textContent = 'Transmitting…'; }
  const result = await submitSignal(submission);
  submission._synced = result.ok;
  submission.crewId = result.ok ? result.crewId : 'LOCAL-' + submission.id.slice(-4).toUpperCase();
  submission.crewSeq = result.ok ? result.crewSeq : null;
  lastConfirmation = submission;
  render();
  await playBurst();
  render();
  if(result.ok) state.submissions = state.submissions.concat([submission]);
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='start'){ form.step = 1; render(); }
  else if(action==='pick-site'){ form.site = t.dataset.value; setError('err-site',''); render(); }
  else if(action==='pick-team'){ form.team = t.dataset.value; setError('err-team',''); render(); }
  else if(action==='pick-pri'){ form.priority = t.dataset.pri; render(); }
  else if(action==='toggle-demo'){ form.wantsDemo = !form.wantsDemo; render(); }
  else if(action==='toggle-skill'){ form.wantsSkillShare = !form.wantsSkillShare; render(); }
  else if(action==='launch'){ e.preventDefault(); launchSignal(); }
  else if(action==='reset'){ lastConfirmation=null; panelEntered=false; form={step:0,name:'',site:null,team:null,headline:'',details:'',priority:'Medium',wantsDemo:false,wantsSkillShare:false,skill:''}; location.hash=''; route='form'; render(); }
  else if(action==='go-dash'){ e.preventDefault(); route='dashboard'; location.hash='control'; render(); loadSubmissions(false); }
  else if(action==='go-form'){ e.preventDefault(); lastConfirmation=null; route='form'; location.hash=''; render(); }
  else if(action==='export'){ exportCsv(); }
  else if(action==='refresh'){ loadSubmissions(true); }
});

document.addEventListener('input', function(e){
  const f = e.target.dataset && e.target.dataset.field;
  if(!f) return;
  form[f] = e.target.value;
  const hud = document.querySelector('.hud-readout b');
  if(hud) hud.textContent = Math.round((fieldsFilled()/5)*100)+'%';
});

window.addEventListener('hashchange', function(){
  route = location.hash === '#control' ? 'dashboard' : 'form';
  render();
  if(route==='dashboard') loadSubmissions(false);
});

function boot(){
  render();
  loadSubmissions(false);
}
boot();
</script>

</body>
</html>
